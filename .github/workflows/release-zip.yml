name: Release Plugin Zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('_manifest.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -r "maibot-hyperos4-theme-v${VERSION}.zip" . \
            -x ".git/*" "*.pyc" "__pycache__/*" "config.toml"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: maibot-hyperos4-theme-v*.zip